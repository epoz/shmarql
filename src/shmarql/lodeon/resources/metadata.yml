    enabled: true
  keywords:
    enabled: true
  language:
    enabled: true
    default: en
  license:
    enabled: true
  persistentIdentifiers:
    enabled: true
    defaultType: DOI
  slug:
    enabled: true
  publishStoryZip:
    enabled: true
    default: false
