      hint: Ask an administrator to check the knowledge graph profile configuration.
    ontology_term_unknown:
      title: The ontology term is unknown
      detail: LODEON could not find the requested ontology term.
      hint: Search ontology terms first or use a full IRI or known prefixed name.
      technicalDetailTemplate: 'Unknown ontology term: {term}'
    class_unknown:
      title: The knowledge graph class is unknown
      detail: LODEON could not find the requested class in the active knowledge graph profile.
      hint: Use the configured class list before requesting class-specific tools.
      technicalDetailTemplate: 'Unknown class id: {classId}'
    property_unknown:
      title: The knowledge graph property is unknown
      detail: LODEON could not find the requested property in the active knowledge graph profile.
      hint: Use the configured class profile or predicate list before requesting property-specific tools.
      technicalDetailTemplate: 'Unknown property id: {propertyId}'
    class_iri_missing:
      title: A class IRI is missing
      detail: The active knowledge graph profile contains a class without a usable IRI.
      hint: Ask an administrator to check the generated assistant schema.
    term_expansion_failed:
      title: A schema term could not be expanded
      detail: The active knowledge graph profile contains a term that cannot be expanded to an IRI.
      hint: Ask an administrator to check prefixes and schema terms.
      technicalDetailTemplate: 'Schema term expansion failed for: {term}'
    prefix_unknown:
      title: A schema prefix is unknown
      detail: The active knowledge graph profile references an unknown prefix.
      hint: Ask an administrator to check prefixes and schema terms.
      technicalDetailTemplate: 'Unknown schema prefix: {prefix}'
    property_path_unavailable:
      title: A property path is unavailable
      detail: The active knowledge graph profile contains a property without a usable SPARQL path.
      hint: Ask an administrator to check the generated assistant schema.
      technicalDetailTemplate: 'Property path validation failed for {propertyId}: {reason}'
    property_not_literal:
      title: The property is not a literal property
      detail: LODEON cannot use the selected property for a literal search.
      hint: Choose a literal property or inspect the class profile.
      technicalDetailTemplate: 'Property is not literal: {propertyId}'
    property_not_available_for_class:
      title: The property is not available for the selected class
      detail: LODEON cannot use the selected property with the selected class.
      hint: Choose another property or inspect the class profile.
      technicalDetailTemplate: Property {propertyId} is not available for class {classId}
    identifier_properties_unavailable:
      title: Identifier search is not available for this filter
      detail: No configured identifier properties match the requested filters.
      hint: Try a broader identifier search or inspect the active knowledge graph profile.
    literal_properties_unavailable:
      title: Literal search is not available for this filter
      detail: No configured literal properties match the requested filters.
      hint: Try a broader literal search or inspect the active knowledge graph profile.
    identifier_search_unavailable:
      title: Identifier search is not available for this filter
      detail: No configured identifier properties match the requested filters.
      hint: Try a broader identifier search or inspect the active knowledge graph profile.
    literal_search_unavailable:
      title: Literal search is not available for this filter
      detail: No configured literal properties match the requested filters.
      hint: Try a broader literal search or inspect the active knowledge graph profile.
  fulltext:
    provider_tool_unavailable:
      title: The fulltext provider cannot run this tool
      detail: LODEON could not execute the requested search tool through the configured fulltext provider.
      hint: Ask an administrator to check the knowledge graph fulltext provider configuration.
      technicalDetailTemplate: Fulltext provider {provider} cannot run tool {tool}
    executor_unavailable:
      title: The fulltext executor is unavailable
      detail: LODEON could not execute the provider-generated fulltext query.
      hint: Ask an administrator to check the knowledge graph fulltext execution path.
      technicalDetailTemplate: Fulltext provider {provider} cannot execute tool {tool} without a SPARQL executor
  followup:
    feature_read_failed:
      title: A follow-up feature file could not be read
      detail: LODEON could not read one of the configured Gherkin follow-up files.
      hint: Check the configured follow-up feature paths and file permissions.
      technicalDetailTemplate: 'Follow-up feature read failed for {path}: {externalError}'
    registry_read_failed:
      title: The follow-up registry could not be read
      detail: LODEON could not read the configured follow-up registry file.
      hint: Check config/runtime/followups/registry.yml and local overrides.
      technicalDetailTemplate: 'Follow-up registry read failed for {path}: {externalError}'
    registry_yaml_invalid:
      title: The follow-up registry YAML is invalid
      detail: LODEON could not parse the configured follow-up registry.
      hint: Validate the YAML syntax of the follow-up registry.
      technicalDetailTemplate: 'Follow-up registry YAML parsing failed for {path}: {externalError}'
    registry_shape_invalid:
      title: The follow-up registry structure is invalid
      detail: The configured follow-up registry does not use the expected YAML object structure.
      hint: Check the follow-up registry schema.
      technicalDetailTemplate: Invalid follow-up registry structure in {path}
    registry_version_invalid:
      title: The follow-up registry version is unsupported
      detail: The configured follow-up registry uses an unsupported schema version.
      hint: Use the current follow-up registry schema version.
      technicalDetailTemplate: 'Unsupported follow-up registry version in {path}: {version}'
    registry_limits_invalid:
      title: The follow-up registry limits are invalid
      detail: A configured follow-up execution limit is invalid.
      hint: Check the limits section of the follow-up registry.
      technicalDetailTemplate: 'Invalid follow-up registry limit: {field}'
    registry_section_invalid:
      title: A follow-up registry section is invalid
      detail: A configured follow-up registry section has the wrong structure.
      hint: Check the runtimeRules and profileRules sections.
      technicalDetailTemplate: Invalid follow-up registry section {section} in {path}
    registry_include_invalid:
      title: A follow-up include pattern is invalid
      detail: A configured follow-up include pattern is not valid.
      hint: Use relative .feature include patterns inside the follow-up directory.
      technicalDetailTemplate: 'Invalid follow-up include pattern in {path}: {pattern}'
    registry_query_templates_invalid:
      title: The follow-up query-template configuration is invalid
      detail: The configured follow-up query-template section has the wrong structure.
      hint: Check queryTemplates.directory in the follow-up registry.
      technicalDetailTemplate: Invalid follow-up query-template field {field} in {path}
    registry_include_resolved_outside_root:
      title: A follow-up include resolves outside its root
      detail: A configured follow-up include pattern points outside the allowed follow-up directory.
      hint: Use only safe relative include patterns.
      technicalDetailTemplate: 'Follow-up include resolved outside {root}: {candidate}'
    path_unsafe:
      title: A follow-up path is unsafe
      detail: A configured follow-up path is absolute, empty, or leaves the allowed directory.
      hint: Use safe relative paths in follow-up configuration.
      technicalDetailTemplate: 'Unsafe follow-up path for {field} in {path}: {value}'
    identifier_invalid:
      title: A follow-up identifier is invalid
      detail: A configured follow-up identifier contains unsupported characters.
      hint: Use simple configuration identifiers with letters, numbers, underscores, or hyphens.
      technicalDetailTemplate: 'Invalid follow-up identifier for {field}: {value}'
    rule_duplicate:
      title: A follow-up rule is duplicated
      detail: The configured follow-up rules contain duplicate generated rule identifiers.
      hint: Rename duplicate Gherkin scenarios or rules.
      technicalDetailTemplate: 'Duplicate follow-up rule IDs in {path}: {ruleIds}'
    tool_action_incomplete:
      title: A follow-up tool action is incomplete
      detail: A configured follow-up tool action is missing a required tool name or query template.
      hint: Check the Gherkin action step for the affected rule.
      technicalDetailTemplate: Incomplete follow-up tool action in rule {ruleId}
    query_template_unsafe:
      title: A follow-up query template is not read-only
      detail: A configured follow-up query template would produce a non-read-only SPARQL query.
      hint: Use only SELECT, ASK, CONSTRUCT, or DESCRIBE in follow-up query templates.
      technicalDetailTemplate: 'Unsafe follow-up query template {template}: {reason}'
    tool_scope_empty:
      title: A follow-up tool scope is empty
      detail: A configured follow-up tool-scope action does not list any tools.
      hint: Add at least one tool to the Gherkin tool-scope table.
      technicalDetailTemplate: Empty follow-up tool scope in rule {ruleId}
    tool_scope_unknown_tool:
      title: A follow-up tool scope references an unknown tool
      detail: A configured follow-up tool-scope action references tools that are not available.
      hint: Check the configured tool names in the Gherkin tool-scope table.
      technicalDetailTemplate: 'Unknown follow-up tool names in rule {ruleId}: {toolNames}'
    tool_scope_multiple:
      title: Multiple follow-up tool scopes matched
      detail: More than one follow-up rule tried to constrain the tool catalog for the same model call.
      hint: Adjust the follow-up rules so only one tool-scope rule can match.
    template_filter_unknown:
      title: A follow-up template filter is unknown
      detail: A follow-up query template uses an unsupported template filter.
      hint: Use only supported follow-up template filters.
      technicalDetailTemplate: 'Unknown follow-up template filter: {filterName}'
    template_variable_missing:
      title: A follow-up template variable is missing
      detail: A follow-up query template references a variable that is not available.
      hint: Check the template variables bound by the follow-up rule.
      technicalDetailTemplate: 'Missing follow-up template variable: {variableName}'
    template_expression_unsupported:
      title: A follow-up template expression is unsupported
      detail: A follow-up query template contains an unsupported template expression.
      hint: Use only the supported follow-up template syntax.
      technicalDetailTemplate: 'Unsupported follow-up template expression: {expression}'
    template_binding_missing_tool:
      title: A follow-up template binding has no tool result
      detail: A follow-up rule tried to bind a query variable from a previous tool call, but no previous tool call is available.
      hint: Check the rule conditions before binding variables from previous tool arguments.
      technicalDetailTemplate: Missing previous tool event for follow-up rule {ruleId}
    template_binding_missing_argument:
      title: A follow-up template binding argument is missing
      detail: A follow-up rule tried to bind a query variable from a tool argument that is not available.
      hint: Check the source argument name in the follow-up rule.
      technicalDetailTemplate: Missing argument {argument} for follow-up rule {ruleId}
    query_template_directory_invalid:
      title: The follow-up query-template directory is invalid
      detail: The configured follow-up query-template directory is outside the allowed follow-up profile directory.
      hint: Use a safe relative query-template directory.
      technicalDetailTemplate: 'Invalid follow-up query-template directory: {directory}'
    query_template_path_invalid:
      title: A follow-up query-template path is invalid
      detail: A configured follow-up query template is outside the allowed query-template directory.
      hint: Use a safe relative path inside the configured query-template directory.
      technicalDetailTemplate: 'Invalid follow-up query-template path: {template}'
    query_template_read_failed:
      title: A follow-up query template could not be read
      detail: LODEON could not read a configured follow-up query template.
      hint: Check the query-template path and file permissions.
      technicalDetailTemplate: 'Follow-up query-template read failed for {template}: {externalError}'
    gherkin_parser_unavailable:
      title: The Gherkin parser is unavailable
      detail: LODEON could not load the parser required for follow-up feature files.
      hint: Check the API dependencies.
    feature_gherkin_invalid:
      title: A follow-up feature file is invalid
      detail: LODEON could not parse a configured Gherkin follow-up file.
      hint: Validate the Gherkin syntax of the follow-up feature.
      technicalDetailTemplate: 'Invalid follow-up Gherkin in {path}: {externalError}'
    feature_missing:
      title: A follow-up feature is missing
      detail: A configured Gherkin follow-up file does not contain a feature.
      hint: Add a Feature section to the follow-up file.
      technicalDetailTemplate: Missing follow-up feature in {path}
    feature_no_scenarios:
      title: A follow-up feature has no scenarios
      detail: A configured Gherkin follow-up feature does not contain any scenarios.
      hint: Add at least one Scenario to the follow-up feature.
      technicalDetailTemplate: Follow-up feature has no scenarios in {path}
    scenario_steps_missing:
      title: A follow-up scenario has no steps
      detail: A configured follow-up scenario does not contain any Gherkin steps.
      hint: Add Given, When, and Then steps to the scenario.
      technicalDetailTemplate: 'Follow-up scenario has no steps in {path}: {scenario}'
    trigger_unknown:
      title: A follow-up trigger is unknown
      detail: A configured follow-up scenario uses an unsupported When step.
      hint: Use the supported follow-up trigger step.
      technicalDetailTemplate: 'Unknown follow-up trigger in {path}: {scenario}: {trigger}'
    trigger_duplicate:
      title: A follow-up trigger is duplicated
      detail: A configured follow-up scenario contains more than one trigger step.
      hint: Use exactly one When step per follow-up scenario.
      technicalDetailTemplate: 'Duplicate follow-up trigger in {path}: {scenario}'
    trigger_after_actions:
      title: A follow-up trigger appears after actions
      detail: A configured follow-up scenario places the trigger after action steps.
      hint: Place the When step before all Then action steps.
      technicalDetailTemplate: 'Follow-up trigger appears after actions in {path}: {scenario}'
    trigger_required_before_actions:
      title: A follow-up trigger is required before actions
      detail: A configured follow-up scenario defines actions before the trigger step.
      hint: Place the When step before all Then action steps.
      technicalDetailTemplate: 'Follow-up trigger required before actions in {path}: {scenario}'
    conditions_after_trigger:
      title: Follow-up conditions appear after the trigger
      detail: A configured follow-up scenario defines condition steps after the trigger.
      hint: Place all Given and condition And steps before the When step.
      technicalDetailTemplate: 'Follow-up conditions appear after the trigger in {path}: {scenario}'
    step_order_invalid:
      title: A follow-up step order is invalid
      detail: A configured follow-up scenario uses an unsupported step order or keyword.
      hint: Use Given conditions, one When trigger, and Then actions.
      technicalDetailTemplate: 'Invalid follow-up step order in {path}: {scenario}: {keyword} {stepText}'
    condition_required:
      title: A follow-up condition is required
      detail: A configured follow-up scenario does not define any condition steps.
      hint: Add at least one Given condition.
      technicalDetailTemplate: 'Missing follow-up condition in {path}: {scenario}'
    trigger_required:
      title: A follow-up trigger is required
      detail: A configured follow-up scenario does not define the required trigger step.
      hint: Add the supported When step to the scenario.
      technicalDetailTemplate: 'Missing follow-up trigger in {path}: {scenario}'
    action_required:
      title: A follow-up action is required
      detail: A configured follow-up scenario does not define any action steps.
      hint: Add at least one Then action.
      technicalDetailTemplate: 'Missing follow-up action in {path}: {scenario}'
    phase_invalid:
      title: A follow-up phase is invalid
      detail: A configured follow-up condition references an invalid phase.
      hint: Use a valid follow-up phase identifier.
      technicalDetailTemplate: 'Invalid follow-up phase in {path}: {scenario}: {phase}'
    model_task_invalid:
      title: A model task is invalid
      detail: A configured follow-up condition or action references an invalid model task.
      hint: Use one of the supported model task identifiers.
      technicalDetailTemplate: 'Invalid model task in {path}: {scenario}: {task}'
    condition_unknown:
      title: A follow-up condition is unknown
      detail: A configured follow-up scenario uses an unsupported condition step.
      hint: Use only supported follow-up condition steps.
      technicalDetailTemplate: 'Unknown follow-up condition in {path}: {scenario}: {condition}'
    action_unknown:
      title: A follow-up action is unknown
      detail: A configured follow-up scenario uses an unsupported action step.
      hint: Use only supported follow-up action steps.
      technicalDetailTemplate: 'Unknown follow-up action in {path}: {scenario}: {action}'
    tool_name_invalid:
      title: A follow-up tool name is invalid
      detail: A configured follow-up action references an invalid tool name.
      hint: Use a valid tool identifier.
      technicalDetailTemplate: 'Invalid follow-up tool name in {path}: {scenario}: {toolName}'
    tool_scope_table_missing:
      title: A follow-up tool-scope table is missing
      detail: A configured follow-up tool-scope action does not include a tool table.
      hint: Add a one-column Gherkin table with allowed tool names.
      technicalDetailTemplate: 'Missing follow-up tool-scope table in {path}: {scenario}'
    tool_scope_table_row_invalid:
      title: A follow-up tool-scope table row is invalid
      detail: A configured follow-up tool-scope table row does not contain exactly one tool name.
      hint: Use one tool name per Gherkin table row.
      technicalDetailTemplate: 'Invalid follow-up tool-scope table row in {path}: {scenario}: {cellCount}'
    tool_scope_table_empty:
      title: A follow-up tool-scope table is empty
      detail: A configured follow-up tool-scope table does not contain any tool names.
      hint: Add at least one tool name to the table.
      technicalDetailTemplate: 'Empty follow-up tool-scope table in {path}: {scenario}'
    tool_scope_table_duplicate:
      title: A follow-up tool-scope table contains duplicates
      detail: A configured follow-up tool-scope table lists a tool more than once.
      hint: Remove duplicate tool names from the table.
      technicalDetailTemplate: 'Duplicate follow-up tool-scope entries in {path}: {scenario}: {toolNames}'
    prompt_id_invalid:
      title: A follow-up prompt ID is invalid
      detail: A configured follow-up action references an invalid prompt ID.
      hint: Use a safe relative prompt identifier.
      technicalDetailTemplate: 'Invalid follow-up prompt ID in {path}: {scenario}: {promptId}'
    error_code_invalid:
      title: A follow-up error code is invalid
      detail: A configured follow-up action references an invalid error code.
      hint: Use a registry-backed dotted error code.
      technicalDetailTemplate: 'Invalid follow-up error code in {path}: {scenario}: {errorCode}'
    regex_invalid:
      title: A follow-up regular expression is invalid
      detail: A configured follow-up condition contains an invalid regular expression.
      hint: Check the user-message regex in the Gherkin condition.
      technicalDetailTemplate: 'Invalid follow-up regex in {path}: {scenario}: {externalError}'
