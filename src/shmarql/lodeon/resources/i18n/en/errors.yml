      hint: Set --knowledge-graph-profile or configure knowledgeGraph.defaultProfile.
    arguments:
      conflicting_case_selection:
        title: The tracer arguments are conflicting
        detail: The tracer received mutually exclusive case-selection arguments.
        hint: Use either --case or competency-question selection arguments, not both.
    input_invalid:
      title: The tracer input is invalid
      detail: The tracer could not read or parse the requested input file.
      hint: Check the JSON, JSONL, or messages file used for the trace run.
    input:
      message_not_object:
        title: The tracer message input is invalid
        detail: A message entry in the tracer input file is not a JSON object.
        hint: Check the messages file used for the trace run.
        technicalDetailTemplate: Invalid message entry in {path} at index {index}
      message_role_invalid:
        title: The tracer message role is invalid
        detail: A message entry in the tracer input file uses an unsupported role.
        hint: Use one of the roles accepted by the LODEON assistant chat payload.
        technicalDetailTemplate: Invalid message role in {path} at index {index}
      message_content_invalid:
        title: The tracer message content is invalid
        detail: A message entry in the tracer input file has empty or invalid content.
        hint: Use non-empty string content for each message.
        technicalDetailTemplate: Invalid message content in {path} at index {index}
      messages_empty:
        title: The tracer messages file is empty
        detail: The tracer messages file does not contain any messages.
        hint: Add at least one message object to the tracer messages file.
        technicalDetailTemplate: No messages found in {path}
      expected_json_object:
        title: The tracer JSON input is invalid
        detail: The tracer expected a JSON object but received another JSON value.
        hint: Check the JSON input file used for this tracer option.
        technicalDetailTemplate: Expected JSON object for {label} in {path}
      expected_json_array:
        title: The tracer JSON input is invalid
        detail: The tracer expected a JSON array but received another JSON value.
        hint: Check the JSON input file used for this tracer option.
        technicalDetailTemplate: Expected JSON array for {label} in {path}
      read_failed:
        title: The tracer input file could not be read
        detail: The tracer could not read the requested input file.
        hint: Check that the file exists and is readable.
        technicalDetailTemplate: 'Reading {path} failed: {externalError}'
      invalid_json:
        title: The tracer JSON input is invalid
        detail: The tracer could not parse the requested input file as JSON.
        hint: Check the JSON syntax of the input file.
        technicalDetailTemplate: 'Parsing {path} failed: {externalError}'
    output:
      write_failed:
        title: The tracer output could not be written
        detail: The tracer could not add benchmark metadata to the generated trace artifact.
        hint: Check that the configured trace output directory is writable.
        technicalDetailTemplate: 'Writing {path} failed: {externalError}'
    competency:
      unknown_or_disabled:
        title: The tracer competency question selection is invalid
        detail: One or more selected competency questions are unknown or disabled for benchmarking.
        hint: Check the selected competency question ids and benchmark flags.
        technicalDetailTemplate: 'Unknown or disabled competency question ids: {ids}'
      none_enabled:
        title: The tracer found no benchmark competency questions
        detail: The configured competency-question file does not contain enabled benchmark questions.
        hint: Enable benchmark metadata for at least one competency question.
        technicalDetailTemplate: No benchmark competency questions found in {path}
      parser_unavailable:
        title: The tracer competency parser is unavailable
        detail: The tracer could not load the competency-question parser.
        hint: Run the tracer in an environment with the LODEON API dependencies available.
        technicalDetailTemplate: 'Competency parser import failed: {externalError}'
    http_failed:
      title: The traced LODEON endpoint failed
      detail: The tracer could not complete an HTTP request against the LODEON API.
      hint: Check that the target LODEON instance is running and reachable.
    response_invalid:
      title: The traced endpoint returned an invalid response
      detail: The tracer received a response that could not be parsed as the expected JSON payload.
      hint: Check the target endpoint and server logs.
    tool_result:
      available:
        title: Tool result available
        detail: The tracer recorded that a tool result is available.
        hint: Inspect the trace details for the full tool result.
      external_message:
        title: Tool result message available
        detail: The tracer recorded a tool-provided result message.
        hint: Inspect the trace details for the full tool result.
        technicalDetailTemplate: '{externalMessage}'
      rows:
        title: Tool result rows available
        detail: The tracer recorded tabular rows returned by a tool.
        hint: Inspect the trace details for the full tool result.
        technicalDetailTemplate: 'Rows: {rows}; variables: {variables}'
      paths:
        title: Tool result paths available
        detail: The tracer recorded query paths returned by a tool.
        hint: Inspect the trace details for the full tool result.
        technicalDetailTemplate: 'Paths: {paths}'
      candidates:
        title: Tool result candidates available
        detail: The tracer recorded candidates returned by a tool.
        hint: Inspect the trace details for the full tool result.
        technicalDetailTemplate: 'Candidates: {candidates}'
      count:
        title: Tool result count available
        detail: The tracer recorded a result count returned by a tool.
        hint: Inspect the trace details for the full tool result.
        technicalDetailTemplate: 'Count: {count}'
      status:
        title: Tool result status available
        detail: The tracer recorded a status returned by a tool.
        hint: Inspect the trace details for the full tool result.
        technicalDetailTemplate: 'Status: {status}'
    warning:
      aggregation_without_run_sparql:
        title: Aggregation question did not reach SPARQL execution
        detail: The trace suggests an aggregation-style request, but no successful SPARQL execution ran.
        hint: Review tool scopes, follow-up rules, and whether run_sparql should have been used.
      benchmark_duration_limit_exceeded:
        title: Benchmark duration limit exceeded
        detail: The trace duration exceeded the configured competency-question benchmark limit.
        hint: Review model latency, endpoint latency, and benchmark thresholds.
      benchmark_evidence_missing:
        title: Benchmark evidence is missing
        detail: The benchmark expected successful evidence, but the trace did not contain it.
        hint: Review tool use, tool scopes, and competency-question benchmark expectations.
      benchmark_exact_identifier_missing:
        title: Benchmark exact identifier is missing
        detail: The benchmark expected an exact identifier in tool arguments, but the trace did not contain it.
        hint: Review identifier-preservation prompts and generated tool arguments.
      benchmark_expectation_missing:
        title: Benchmark expectation is missing
        detail: The trace references a competency question without a matching benchmark expectation.
        hint: Check the competency-question file and benchmark metadata.
      benchmark_expected_mention_missing:
        title: Benchmark expected mention is missing
        detail: The benchmark expected a mention that was not found in the trace.
        hint: Review answer synthesis, evidence rows, and competency-question benchmark expectations.
      benchmark_expected_tool_any_missing:
        title: Benchmark expected tool group is missing
        detail: None of the accepted benchmark tools ran successfully.
        hint: Review tool availability, tool scopes, and benchmark expectations.
      benchmark_expected_tool_missing:
        title: Benchmark expected tool is missing
        detail: A required benchmark tool did not run successfully.
        hint: Review tool availability, tool scopes, and benchmark expectations.
      benchmark_forbidden_tool_used:
        title: Benchmark forbidden tool was used
        detail: A tool forbidden by the benchmark expectation was used.
        hint: Review follow-up rules, tool scopes, and benchmark expectations.
      benchmark_input_token_limit_exceeded:
        title: Benchmark input-token limit exceeded
        detail: The trace input-token count exceeded the configured competency-question benchmark limit.
        hint: Review prompt/context size and benchmark thresholds.
      benchmark_proposal_missing:
        title: Benchmark proposal is missing
        detail: The benchmark expected a proposal after evidence, but the trace did not contain it.
        hint: Review proposal tools, follow-up rules, and competency-question benchmark expectations.
      benchmark_warning_limit_exceeded:
        title: Benchmark warning limit exceeded
        detail: The trace contained more non-error warnings than allowed by the benchmark.
        hint: Review trace warnings and competency-question benchmark thresholds.
      empty_tool_scope:
        title: Tool scope removed all tools
        detail: A tool scope reduced the model-visible tool catalog to zero tools.
        hint: Review the matching follow-up rule and tool-scope configuration.
      expensive_suggestions:
        title: Suggestion call used many input tokens
        detail: The assistant suggestion request exceeded the configured input-token warning threshold.
        hint: Review suggestion prompt context and tool trace size.
      high_model_input_tokens:
        title: Model call used many input tokens
        detail: A model response reported input-token usage above the configured warning threshold.
        hint: Review prompt context, story context, and tool-result compression.
      high_model_message_chars:
        title: Model request context is large
        detail: A model request exceeded the configured message-character warning threshold.
        hint: Review prompt context, story context, and tool-result compression.
      high_system_prompt_chars:
        title: System prompt is large
        detail: A prompt build exceeded the configured system-prompt warning threshold.
        hint: Review runtime prompts, profile prompts, and context compaction.
      high_tool_schema_chars:
        title: Tool schema context is large
        detail: A model request exceeded the configured tool-schema warning threshold.
        hint: Review available tool catalog size and tool-scope rules.
      large_tool_evidence:
        title: Synthesis evidence is large
        detail: A synthesis prompt included evidence above the configured size threshold.
        hint: Review SPARQL result sizes and synthesis compression.
      long_content_fallback_continuation:
        title: Content fallback repeated too often
        detail: The assistant used content-fallback continuation more often than the configured threshold.
        hint: Review model behavior and synthesis prompts.
      model_error:
        title: Model error recorded
        detail: The trace contains a model-error event.
        hint: Review provider configuration, model response, and external error details.
      model_failed_before_tool_call:
        title: Model failed before tool use
        detail: The model request failed before any assistant tool call was executed.
        hint: Review model/tool-call compatibility and provider errors.
      ollama_tool_schema_model_error:
        title: Ollama model failed with native tools enabled
        detail: An Ollama-backed model request failed while native tool schemas were enabled.
        hint: Review model support for tool calling and the size of the tool schema.
      proposal_before_evidence:
        title: Proposal ran before evidence
        detail: A proposal tool ran before any successful evidence tool.
        hint: Review follow-up rules and proposal tool ordering.
      proposal_loop:
        title: Multiple proposal tools ran
        detail: More proposal tools ran in one turn than the configured threshold allows.
        hint: Review proposal follow-up rules and tool scopes.
      recoverable_tool_error:
        title: Tool error was recovered
        detail: A tool ended with an error status, but later follow-up action recovered successful evidence.
        hint: Review the failed tool and follow-up recovery path.
      recoverable_tool_timeout:
        title: Tool timeout was recovered
        detail: A tool timeout occurred, but later follow-up action recovered successful evidence.
        hint: Review the timed-out tool and follow-up recovery path.
      recovered_by_followup:
        title: Follow-up recovered the turn
        detail: A follow-up rule recovered successful evidence after earlier tool errors.
        hint: Review the follow-up path and whether the original tool failure should be optimized.
      repeated_identical_tool_calls:
        title: Repeated identical tool calls detected
        detail: The trace contains repeated identical tool calls above the configured threshold.
        hint: Review follow-up rules and model instructions to avoid loops.
      repeated_tool_calls:
        title: Repeated tool calls detected
        detail: The trace contains repeated tool calls above the configured threshold.
        hint: Review follow-up rules and model instructions to avoid loops.
      schema_only_instance_answer:
        title: Instance question used only schema tools
        detail: The user request appears to ask for data instances, but only schema tools succeeded.
        hint: Review tool scopes and whether run_sparql or search tools should have been used.
      slow_operation:
        title: Trace operation was slow
        detail: A traced operation exceeded the configured duration warning threshold.
        hint: Review model latency, endpoint latency, and tool timings.
      slow_tool:
        title: Tool call was slow
        detail: A tool call exceeded the configured duration warning threshold.
        hint: Review remote endpoint latency, query complexity, and tool implementation.
      strong_tool_scope_reduction:
        title: Tool scope strongly reduced available tools
        detail: A tool scope removed a large share of model-visible tools.
        hint: Review whether the scoped tool catalog still supports the user task.
      too_many_tool_calls:
        title: Assistant used many tools
        detail: The assistant turn used more tools than the configured warning threshold.
        hint: Review model behavior, follow-up rules, and task decomposition.
      tool_error:
        title: Tool error recorded
        detail: A tool ended with a non-success status.
        hint: Review the tool result and external error details.
      tool_timeout:
        title: Tool timeout recorded
        detail: A tool reported a timeout.
        hint: Review query complexity, remote endpoint latency, and timeout settings.
      use_tools_without_evidence:
        title: Tool use produced no evidence
        detail: Tool use was requested, but no successful evidence tool ran.
        hint: Review model tool use, tool scopes, and provider/tool-call compatibility.
      weak_tool_synthesis:
        title: Tool-backed synthesis is weak
        detail: A tool-backed turn produced an empty, very short, or pseudo-tool-call final answer.
        hint: Review synthesis prompts and model behavior after tool results.
    check:
      final_message_returned:
        title: The assistant returned a final message
        detail: The benchmark check found a non-empty assistant message.
        hint: Review the trace report for the corresponding benchmark step.
      suggestions_returned:
        title: Assistant suggestions were returned
        detail: The benchmark check received suggestion questions.
        hint: Review the trace report for the corresponding benchmark step.
        technicalDetailTemplate: 'Suggestion question count: {count}'
      response_tool_found:
        title: The response used an expected tool
        detail: The benchmark check found an expected tool in the assistant response.
        hint: Review the trace report for the corresponding benchmark step.
        technicalDetailTemplate: 'Expected tool: {tool}'
      response_any_tool_found:
        title: The response used one accepted tool
        detail: The benchmark check found at least one accepted tool in the assistant response.
        hint: Review the trace report for the corresponding benchmark step.
        technicalDetailTemplate: 'Accepted tools: {tools}'
      response_identifier_preserved:
        title: The response preserved an identifier
        detail: The benchmark check found the expected identifier in the assistant response.
        hint: Review the trace report for the corresponding benchmark step.
        technicalDetailTemplate: 'Identifier: {identifier}'
      trace_file_found:
        title: The trace file was found
        detail: The benchmark check found the trace file for the assistant run.
        hint: Review the trace report for the corresponding benchmark step.
        technicalDetailTemplate: 'Trace file: {path}'
      response_or_trace_tool_found:
        title: The response or trace used an expected tool
        detail: The benchmark check found an expected tool in the response or trace.
        hint: Review the trace report for the corresponding benchmark step.
        technicalDetailTemplate: 'Expected tool: {tool}'
      response_or_trace_any_tool_found:
        title: The response or trace used one accepted tool
        detail: The benchmark check found at least one accepted tool in the response or trace.
        hint: Review the trace report for the corresponding benchmark step.
        technicalDetailTemplate: 'Accepted tools: {tools}'
      no_error_warnings:
        title: The trace has no error warnings
        detail: The benchmark check found no error-level trace warnings.
        hint: Review the trace report for the corresponding benchmark step.
      warning_count_within_limit:
        title: The trace warning count is within the benchmark limit
        detail: The benchmark check found no more than the allowed number of non-error warnings.
        hint: Review the trace report for the corresponding benchmark step.
        technicalDetailTemplate: 'Trace warnings: {count}; limit: {maxWarnings}'
      evidence_tool_found:
        title: The trace contains an evidence tool
        detail: The benchmark check found a successful evidence-producing tool call.
        hint: Review the trace report for the corresponding benchmark step.
      response_or_trace_identifier_preserved:
        title: The response or trace preserved an identifier
        detail: The benchmark check found the expected identifier in the response or trace.
        hint: Review the trace report for the corresponding benchmark step.
        technicalDetailTemplate: 'Identifier: {identifier}'
      trace_or_response_mention_found:
        title: The response or trace mentions an expected value
        detail: The benchmark check found an expected mention in the response or trace.
        hint: Review the trace report for the corresponding benchmark step.
        technicalDetailTemplate: 'Mention: {mention}'
      forbidden_tool_not_used:
        title: A forbidden tool was not used
        detail: The benchmark check confirmed that a forbidden tool was not used.
        hint: Review the trace report for the corresponding benchmark step.
        technicalDetailTemplate: 'Forbidden tool: {tool}'
      proposal_after_evidence:
        title: A proposal followed evidence
        detail: The benchmark check found a proposal tool call after evidence was collected.
        hint: Review the trace report for the corresponding benchmark step.
      proposal_retry_found:
        title: A proposal retry was found
        detail: The benchmark check found a proposal retry prompt.
        hint: Review the trace report for the corresponding benchmark step.
      duration_within_limit:
        title: The trace duration is within the benchmark limit
        detail: The benchmark check measured a duration within the configured limit.
        hint: Review the trace report for the corresponding benchmark step.
        technicalDetailTemplate: 'Duration: {durationMs} ms; limit: {maxDurationMs} ms'
      input_tokens_unavailable:
        title: Input token count is unavailable
        detail: The benchmark check could not determine the input token count from the trace.
        hint: Review whether model usage metadata was available in the trace.
      input_tokens_within_limit:
        title: Input token count is within the benchmark limit
        detail: The benchmark check measured an input token count within the configured limit.
        hint: Review the trace report for the corresponding benchmark step.
        technicalDetailTemplate: 'Input tokens: {inputTokens}; limit: {maxInputTokens}'
    failure:
      final_message_missing:
        title: The assistant returned no final message
        detail: The benchmark check did not find a usable final assistant message.
        hint: Review the assistant response and model/tool trace for this benchmark run.
      trace_file_missing:
        title: The trace file is missing
        detail: The benchmark check could not find the trace file for the assistant run.
        hint: Check tracing configuration and the trace output directory.
        technicalDetailTemplate: Trace id {traceId} was not found below {traceDir}
      expected_tool_missing:
        title: An expected tool was not used
        detail: The benchmark check did not find an expected tool in the response or trace.
        hint: Review tool availability, tool scopes, and the competency-question benchmark expectations.
        technicalDetailTemplate: 'Missing tool: {tool}'
      any_expected_tool_missing:
        title: No accepted tool was used
        detail: The benchmark check did not find any accepted tool in the response or trace.
        hint: Review tool availability, tool scopes, and the competency-question benchmark expectations.
        technicalDetailTemplate: 'Accepted tools: {tools}'
      trace_warning_error:
        title: The trace contains an error warning
        detail: The benchmark check found an error-level trace warning.
        hint: Review the trace analyzer warning code and the related trace events.
        technicalDetailTemplate: 'Trace warning code: {warningCode}'
      trace_warning:
        title: The trace contains a warning
        detail: The benchmark check was configured to fail on warnings and found a trace warning.
        hint: Review the trace analyzer warning code and the related trace events.
        technicalDetailTemplate: 'Trace warning code: {warningCode}'
      warning_count_exceeded:
        title: The trace warning count exceeds the benchmark limit
        detail: The benchmark check found more than the allowed number of non-error warnings.
        hint: Review the trace warnings and the competency-question benchmark threshold.
        technicalDetailTemplate: 'Trace warnings: {count}; limit: {maxWarnings}'
      evidence_tool_missing:
        title: The trace contains no evidence tool
        detail: The benchmark check expected evidence but found no successful evidence-producing tool call.
        hint: Review tool scopes, model tool use, and the competency-question benchmark expectations.
      identifier_not_preserved:
        title: An expected identifier was not preserved
        detail: The benchmark check did not find the expected identifier in the response or trace.
        hint: Review the prompt, generated query, and benchmark identifier expectation.
        technicalDetailTemplate: 'Identifier: {identifier}'
      mention_missing:
        title: An expected mention is missing
        detail: The benchmark check did not find an expected mention in the response or trace.
        hint: Review the answer synthesis, tool results, and benchmark mention expectation.
        technicalDetailTemplate: 'Mention: {mention}'
      forbidden_tool_used:
        title: A forbidden tool was used
        detail: The benchmark check found a tool that this question forbids.
        hint: Review tool scopes and the competency-question forbidden-tool expectation.
        technicalDetailTemplate: 'Forbidden tool: {tool}'
      proposal_after_evidence_missing:
        title: A proposal did not follow evidence
        detail: The benchmark check expected a proposal after evidence but did not find one.
        hint: Review proposal tool scopes, follow-up rules, and benchmark expectations.
      proposal_retry_missing:
        title: A proposal retry is missing
        detail: The benchmark check expected a proposal retry prompt but did not find one.
        hint: Review proposal retry follow-up rules and benchmark expectations.
      duration_exceeded:
        title: The trace duration exceeds the benchmark limit
        detail: The benchmark check measured a duration above the configured limit.
        hint: Review model latency, endpoint latency, and the benchmark duration threshold.
        technicalDetailTemplate: 'Duration: {durationMs} ms; limit: {maxDurationMs} ms'
      input_tokens_exceeded:
        title: Input token count exceeds the benchmark limit
        detail: The benchmark check measured an input token count above the configured limit.
        hint: Review prompt/context size and the competency-question token threshold.
        technicalDetailTemplate: 'Input tokens: {inputTokens}; limit: {maxInputTokens}'
    analyze:
      failed:
        title: The trace analysis failed
        detail: The trace analyzer failed while processing trace input.
        hint: Check the trace analyzer command and input files.
        technicalDetailTemplate: 'Trace analysis failed: {externalError}'
      competency_parser_unavailable:
        title: The trace analyzer competency parser is unavailable
        detail: The trace analyzer could not load the competency-question parser.
        hint: Run the analyzer in an environment with the LODEON API dependencies available.
        technicalDetailTemplate: 'Competency parser import failed: {externalError}'
      invalid_trace_json:
        title: The trace file contains invalid JSON
        detail: The trace analyzer could not parse one JSONL line in a trace file.
        hint: Check the trace file or regenerate the trace.
        technicalDetailTemplate: 'Invalid JSON in {path} at line {line}: {externalError}'
      invalid_trace_event:
        title: The trace file contains an invalid event
        detail: Each JSONL line in a trace file must contain one event object.
        hint: Check the trace file or regenerate the trace.
        technicalDetailTemplate: 'Invalid trace event in {path} at line {line}: {reason}'
      no_trace_files:
        title: No trace files were found
        detail: The trace analyzer did not find any trace files for the requested paths.
        hint: Check the input path or trace output directory.
      output_required:
        title: The trace analyzer output path is missing
        detail: The selected trace analysis format requires an output file.
        hint: Provide an output path for the requested analysis format.
        technicalDetailTemplate: Missing output path for format {format}
      evaluation_artifacts_dir_required:
        title: The evaluation adapter artifact directory is missing
        detail: The trace analyzer needs an artifact directory when evaluation adapters or evaluation result imports are requested.
        hint: Provide --evaluation-artifacts-dir for the adapter run.
      evaluation_result_file_invalid:
        title: The evaluation result file argument is invalid
        detail: The trace analyzer expects evaluation result files in adapterId=path format.
        hint: Use --evaluation-result-file with an adapter id and a file path.
      evaluation_adapter_unknown:
        title: The evaluation adapter is unknown
        detail: The trace analyzer received an evaluation adapter id that is not registered.
        hint: Use one of the registered evaluation adapter ids.
        technicalDetailTemplate: 'Unknown adapter id: {adapterId}'
  leaflet:
    geojson_invalid:
      title: The GeoJSON is invalid
      detail: LODEON could not normalize the geographic input as GeoJSON.
      hint: Check the JSON structure and use a supported GeoJSON geometry.
      technicalDetailTemplate: 'GeoJSON normalization failed: {externalError}'
    geometry_unsupported:
      title: The map geometry is unsupported
      detail: LODEON cannot render one of the supplied geographic geometry types.
      hint: Use a GeoJSON Point, MultiPoint, LineString, MultiLineString, Polygon, MultiPolygon, or GeometryCollection.
      technicalDetailTemplate: 'Unsupported geometry type: {geometryType}'
    coordinate_invalid:
      title: A map coordinate is invalid
      detail: LODEON could not normalize a latitude or longitude value.
      hint: Use a latitude from -90 to 90 and a longitude from -180 to 180.
      technicalDetailTemplate: 'Invalid coordinate at item {index}: latitude={latitude}, longitude={longitude}'
    sparql_variables_missing:
      title: The map query result is missing geographic variables
      detail: The SPARQL result does not contain latitude and longitude or a supported geometry.
      hint: Return ?latitude and ?longitude or return ?geometry.
      technicalDetailTemplate: Missing canonical geographic variables in row {row}
    tile_layer_unavailable:
      title: The map tile layer is unavailable
      detail: LODEON could not find the selected map tile layer in the runtime configuration.
      hint: Select a configured tile layer or ask an administrator to update the Leaflet configuration.
      technicalDetailTemplate: 'Unknown tile layer: {tileLayerId}'
    viewer_initialization_failed:
      title: The interactive map could not be initialized
      detail: LODEON could not start the Leaflet map viewer.
      hint: Retry the preview and check the browser console if the problem continues.
      technicalDetailTemplate: 'Leaflet viewer initialization failed: {externalError}'
    query_empty:
      title: The map query is empty
      detail: LODEON cannot run a map query without SPARQL source text.
      hint: Enter a read-only SPARQL query or create one with the visual query builder.
    file_read_failed:
      title: The GeoJSON file could not be read
      detail: LODEON could not load the selected GeoJSON file in the browser.
      hint: Select a readable UTF-8 JSON or GeoJSON file and try again.
    manual_properties_invalid:
      title: The popup properties are invalid
      detail: LODEON expects the manual point properties to be a JSON object.
      hint: Enter key-value properties in JSON object syntax, for example {"source":"Archive"}.
  verovio:
    input_missing:
      title: Music notation data is missing
      detail: LODEON cannot validate or render an item without text-based music notation data.
      hint: Provide complete MEI or Plaine & Easie data.
    builder_failed:
      title: The visual query builder could not be opened
      detail: LODEON could not complete the visual query builder action.
      hint: Try opening the builder again or edit the SPARQL query directly.
      technicalDetailTemplate: 'Visual query builder failure: {externalError}'
    input_too_large:
      title: The music notation item is too large
      detail: This individual notation item exceeds the configured technical safety size. It was not truncated.
      hint: Reduce the individual encoding size or ask an administrator to review the transparent per-item safety setting.
      technicalDetailTemplate: Item {itemId} has {actualBytes} bytes; configured maximum is {maximumBytes} bytes
    format_unsupported:
      title: The music notation format is unsupported
      detail: LODEON cannot render the declared notation format.
      hint: Use complete MEI or Plaine & Easie data, or omit the format for controlled detection.
      technicalDetailTemplate: 'Unsupported notation format: {format}'
    input_invalid:
      title: The music notation data is invalid
      detail: Verovio could not load the supplied notation item.
      hint: Check the complete encoding and correct the reported validation errors.
      technicalDetailTemplate: 'Validation failed for item {itemId}: {externalError}'
    input_warning:
      title: The music notation data has a warning
      detail: Verovio reported a non-blocking issue in this item. Rendering remains available.
      hint: Review the validation details if you want to correct the source encoding.
      technicalDetailTemplate: 'Validation warning for item {itemId}: {externalError}'
    pae_warning:
      title: The Plaine & Easie data has a warning
      detail: Verovio reported a non-blocking issue in this item. Rendering remains available.
      hint: Review the indicated row and column if you want to correct the source notation.
      technicalDetailTemplate: 'PAE warning for item {itemId} at row {row}, column {column}: {externalError}'
    query_empty:
      title: The notation query is empty
      detail: LODEON cannot run a notation query without SPARQL source text.
      hint: Enter a read-only SPARQL query or create one with the visual query builder.
    sparql_data_missing:
      title: The notation query result is missing data
      detail: The SPARQL result does not contain the required ?data variable.
      hint: Return one complete text-based Verovio input in ?data for every item.
      technicalDetailTemplate: Missing ?data binding in result row {row}
    file_read_failed:
      title: The music notation file could not be read
      detail: LODEON could not read the selected text file in the browser.
      hint: Select a readable UTF-8 MEI or Plaine & Easie file and try again.
    result_empty:
      title: The notation query returned no items
      detail: The successful query did not return any music notation items.
      hint: Review the query or keep the previous validated render state.
    render_failed:
      title: The music notation could not be rendered
      detail: Verovio could not generate the requested notation rendering.
      hint: Review the item validation details and retry rendering.
      technicalDetailTemplate: 'Rendering failed for item {itemId}: {externalError}'
    viewer_initialization_failed:
      title: The music notation viewer could not be initialized
      detail: LODEON could not start the controlled Verovio viewer.
      hint: Retry the view and check the technical details if the problem continues.
      technicalDetailTemplate: 'Verovio viewer initialization failed: {externalError}'
    mei_export_failed:
      title: Normalized MEI could not be generated
      detail: Verovio could not generate normalized MEI from this item. The original data remains unchanged.
      hint: Review the item validation details and retry the download.
      technicalDetailTemplate: 'MEI generation failed for item {itemId}: {externalError}'
    midi_generation_failed:
      title: MIDI could not be generated
      detail: Verovio could not generate playback data for this notation item.
      hint: Review the encoding and retry playback.
      technicalDetailTemplate: 'MIDI generation failed for item {itemId}: {externalError}'
    playback_initialization_failed:
      title: Music playback could not be initialized
      detail: LODEON could not initialize the local Web Audio playback system.
      hint: Check browser audio permissions and retry playback.
      technicalDetailTemplate: 'Playback initialization failed: {externalError}'
    soundfont_load_failed:
      title: The local instrument bank could not be loaded
      detail: LODEON could not load the controlled General MIDI soundfont.
      hint: Reload the application and retry playback.
      technicalDetailTemplate: 'Soundfont loading failed: {externalError}'
    playback_failed:
      title: Music playback failed
      detail: LODEON stopped playback because the MIDI player reported an error.
      hint: Retry playback or review the item encoding.
      technicalDetailTemplate: 'Playback failed for item {itemId}: {externalError}'
    seek_failed:
      title: The playback position could not be changed
      detail: LODEON could not move playback to the selected position.
      hint: Restart playback and try again.
      technicalDetailTemplate: 'Seeking failed for item {itemId} at {timeSeconds} seconds: {externalError}'
    compare_selection_invalid:
      title: The comparison selection is invalid
      detail: Compare Mode requires two different available notation items.
      hint: Select one item for A and a different item for B.
    transposition_failed:
      title: The transposed view could not be generated
      detail: Verovio could not generate the explicitly requested target-key view. The original remains available.
      hint: Return to the original view or select another target key.
      technicalDetailTemplate: 'Transposition failed for item {itemId} and target key {targetKey}: {externalError}'
