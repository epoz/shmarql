  sparql:
    request_invalid:
      title: The SPARQL request is invalid
      detail: LODEON could not process the SPARQL request.
      hint: Check the selected knowledge graph profile and query.
      technicalDetailTemplate: 'SPARQL request validation failed with the following error: {reason}'
    profile_required:
      title: A knowledge graph profile is required
      detail: LODEON needs a knowledge graph profile before it can execute this SPARQL query.
      hint: Select a knowledge graph profile and try again.
    query_required:
      title: A SPARQL query is required
      detail: LODEON cannot execute an empty SPARQL request.
      hint: Enter a SELECT, ASK, CONSTRUCT, or DESCRIBE query.
    not_read_only:
      title: The SPARQL query is not read-only
      detail: LODEON only allows read-only SPARQL queries.
      hint: Use SELECT, ASK, CONSTRUCT, or DESCRIBE. SERVICE clauses are allowed, but update operations are blocked.
      technicalDetailTemplate: 'SPARQL read-only validation failed with the following error: {reason}'
    endpoint_failed:
      title: The knowledge graph endpoint did not answer
      detail: LODEON could not retrieve data from the selected knowledge graph endpoint.
      hint: Try again later or ask an administrator to check the knowledge graph profile and endpoint.
      technicalDetailTemplate: 'The knowledge graph endpoint failed with the following error: {externalError}'
    response_invalid:
      title: The SPARQL endpoint returned an invalid response
      detail: LODEON received a response that could not be interpreted as SPARQL results.
      hint: Try again or ask an administrator to inspect the endpoint response.
    result_set_count_invalid:
      title: The result-set count is invalid
      detail: LODEON could not read one exact non-negative total from the configured count variable.
      hint: Use an aggregate count query that returns exactly one row and the configured count variable.
      technicalDetailTemplate: The count query did not return a valid value for variable {countVariable}.
    result_set_page_count_invalid:
      title: The result-set page is inconsistent
      detail: LODEON received a page whose row count does not match the exact total and requested range.
      hint: Try the request again or check that the count and page queries describe the same logical result set.
      technicalDetailTemplate: Expected {expectedRowCount} rows for offset {pageOffset}, page size {pageSize}, and total {totalCount}, but received {actualRowCount}.
    result_set_page_key_invalid:
      title: The result-set keys are inconsistent
      detail: LODEON received a page that does not contain exactly one row for each declared logical result.
      hint: Make the page query return one row per declared result key and make the count query count those same distinct keys.
      technicalDetailTemplate: 'Result keys {resultKeyVariables}; missing columns: {missingKeyVariables}; rows with missing key values: {missingKeyValueCount}; duplicate keys: {duplicateKeyCount}.'
    method_invalid:
      title: The SPARQL HTTP method is invalid
      detail: LODEON could not run the SPARQL request because the configured HTTP method is unsupported.
      hint: Use GET or POST in the knowledge graph profile.
      technicalDetailTemplate: 'SPARQL HTTP method validation failed with the following error: {method}'
    update_operation:
      title: The SPARQL query contains an update operation
      detail: LODEON only allows read-only SPARQL queries.
      hint: Use SELECT, ASK, CONSTRUCT, or DESCRIBE. SERVICE clauses are allowed, but update operations are blocked.
    query_empty:
      title: The SPARQL query is empty
      detail: LODEON cannot run a SPARQL request without a query.
      hint: Enter or generate a SPARQL query and run it again.
    request_failed:
      title: The SPARQL request failed
      detail: LODEON could not complete the SPARQL request.
      hint: Check the query, selected knowledge graph profile, and endpoint status.
      technicalDetailTemplate: 'SPARQL request failed with the following error: {externalError}'
