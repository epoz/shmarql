schemaVersion: 1
locale: en
namespace: errors
messages:
  lodeon:
    unknown:
      title: Something went wrong
      detail: LODEON could not complete the requested operation.
      hint: Please try again. If the problem persists, inspect the trace or server logs.
    not_found:
      title: The requested LODEON endpoint was not found
      detail: LODEON could not find the requested API endpoint.
      hint: Check the requested URL and try again.
      technicalDetailTemplate: No API route matched {method} {path}
  lodeon_problem_error:
    invalid_code:
      title: The LODEON problem definition is invalid
      detail: LODEON tried to create a Problem Details response without a valid error code.
      hint: Check the server-side error construction path.
  api:
    content_length_invalid:
      title: The request body length is invalid
      detail: LODEON could not read the request body because the Content-Length header is invalid.
      hint: Retry the request with a valid HTTP client.
      technicalDetailTemplate: Invalid Content-Length header for {method} {path}
    json_invalid:
      title: The request JSON is invalid
      detail: LODEON could not process the request because the JSON body is invalid.
      hint: Check the request body and try again.
      technicalDetailTemplate: 'Invalid JSON body for {method} {path}: {externalError}'
  tracing:
    disabled:
      title: Tracing was disabled
      detail: LODEON could not initialize tracing and disabled trace recording for this operation.
      hint: Check the tracing output directory and permissions.
      technicalDetailTemplate: 'Tracing initialization failed with the following error: {externalError}'
  app:
    root_missing:
      title: The LODEON application root is missing
      detail: The editor could not find the HTML element where LODEON should be mounted.
      hint: Ask an administrator to check the deployed editor page.
    editor_host_missing:
      title: The LODEON editor host is missing
      detail: The editor could not find the HTML element where the story editor should be mounted.
      hint: Ask an administrator to check the deployed editor page.
    bootstrap_failed:
      title: LODEON could not start
      detail: The editor failed during application startup.
      hint: Reload the page or ask an administrator to inspect the browser console and server logs.
      technicalDetailTemplate: 'Application startup failed with the following error: {externalError}'
    modal_load_failed:
      title: The dialog content could not be loaded
      detail: LODEON could not load the requested dialog content.
      hint: Try again or ask an administrator to check the deployed static files.
      technicalDetailTemplate: 'Dialog content loading failed with the following error: {externalError}'
    config:
      load_failed:
        title: The LODEON configuration could not be loaded
        detail: The editor could not load the public LODEON configuration.
        hint: Ask an administrator to check the API and configuration files.
        technicalDetailTemplate: 'Configuration loading failed with the following error: {externalError}'
      invalid:
        title: The LODEON configuration is invalid
        detail: LODEON could not use the loaded configuration because it is invalid.
        hint: Ask an administrator to validate the configuration files.
        technicalDetailTemplate: 'Configuration validation failed with the following error: {externalError}'
    renderer_engine:
      missing:
        title: The renderer engine is not configured
        detail: LODEON could not find the active renderer engine configuration.
        hint: Ask an administrator to check renderer.activeEngine and the runtime renderer mappings.
  persistence:
    indexeddb_unavailable:
      title: Browser storage is unavailable
      detail: LODEON cannot access the browser database used for local projects.
      hint: Check browser storage permissions, private browsing settings, or site data restrictions.
    project_load_failed:
      title: The local project could not be loaded
      detail: LODEON started with a new empty project because the saved browser project could not be loaded.
      hint: Check browser storage permissions and site data.
      technicalDetailTemplate: 'Local project loading failed with the following error: {externalError}'
    project_save_failed:
      title: The local project could not be saved
      detail: LODEON could not write the current project to browser storage.
      hint: Check available browser storage and site data permissions.
      technicalDetailTemplate: 'Local project saving failed with the following error: {externalError}'
    autosave_failed:
      title: Autosave failed
      detail: LODEON could not save the latest project changes to browser storage.
      hint: Export the project package and check browser storage permissions.
      technicalDetailTemplate: 'Autosave failed with the following error: {externalError}'
    project_list_failed:
      title: Local projects could not be listed
      detail: LODEON could not read the list of browser-local projects.
      hint: Check browser storage permissions and site data.
      technicalDetailTemplate: 'Local project listing failed with the following error: {externalError}'
    project_activate_failed:
      title: The local project could not be opened
      detail: LODEON could not switch to the selected browser-local project.
      hint: Check browser storage permissions and site data.
      technicalDetailTemplate: 'Local project activation failed with the following error: {externalError}'
    project_delete_failed:
      title: The local project could not be deleted
      detail: LODEON could not delete the selected browser-local project.
      hint: Check browser storage permissions and try again.
      technicalDetailTemplate: 'Local project deletion failed with the following error: {externalError}'
    asset_blob_load_failed:
      title: Local project assets could not be loaded
      detail: LODEON could not read browser-local media assets.
      hint: Check browser storage permissions and site data.
      technicalDetailTemplate: 'Local asset loading failed with the following error: {externalError}'
    asset_blob_save_failed:
      title: Local project assets could not be saved
      detail: LODEON could not write browser-local media assets.
      hint: Check available browser storage and site data permissions.
      technicalDetailTemplate: 'Local asset saving failed with the following error: {externalError}'
    asset_blob_delete_failed:
      title: Local project assets could not be deleted
      detail: LODEON could not remove browser-local media assets.
      hint: Check browser storage permissions and try again.
      technicalDetailTemplate: 'Local asset deletion failed with the following error: {externalError}'
  config:
    metadata_panel:
      invalid:
        title: The metadata panel configuration is invalid
        detail: LODEON could not read the metadata panel configuration.
        hint: Ask an administrator to check metadata.
        technicalDetailTemplate: 'Invalid metadata panel field: {field}'
      enabled_invalid:
        title: The metadata panel enabled flag is invalid
        detail: LODEON could not read whether the metadata panel is enabled.
        hint: Ask an administrator to check metadata.enabled.
        technicalDetailTemplate: 'Invalid metadata panel field: {field}'
      config_file_invalid:
        title: The metadata panel runtime file path is invalid
        detail: LODEON could not load the configured metadata panel runtime file.
        hint: Ask an administrator to check metadata.configFile.
        technicalDetailTemplate: 'Invalid metadata panel field: {field}'
      runtime_invalid:
        title: The metadata panel runtime configuration is invalid
        detail: LODEON could not use the metadata panel runtime configuration.
        hint: Ask an administrator to check runtime/metadata-panel.yml.
        technicalDetailTemplate: 'Invalid metadata panel runtime field: {field}'
      schema_version_invalid:
        title: The metadata panel runtime schema version is invalid
        detail: LODEON could not use the metadata panel runtime configuration.
        hint: Ask an administrator to check runtime/metadata-panel.yml.
        technicalDetailTemplate: 'Invalid metadata panel runtime field: {field}'
      contributors_invalid:
        title: The metadata panel contributors configuration is invalid
        detail: LODEON could not read the contributor configuration.
        hint: Ask an administrator to check runtime/metadata-panel.yml.
        technicalDetailTemplate: 'Invalid metadata panel runtime field: {field}'
      contributors_enabled_invalid:
        title: The metadata panel contributors enabled flag is invalid
        detail: LODEON could not read whether contributors are enabled.
        hint: Ask an administrator to check runtime/metadata-panel.yml.
        technicalDetailTemplate: 'Invalid metadata panel runtime field: {field}'
      contributor_roles_invalid:
        title: The metadata panel contributor roles are invalid
        detail: LODEON could not read the configured contributor roles.
        hint: Ask an administrator to check runtime/metadata-panel.yml.
        technicalDetailTemplate: 'Invalid metadata panel runtime field: {field}'
      contributor_role_invalid:
        title: A metadata panel contributor role is invalid
        detail: LODEON could not read one configured contributor role.
        hint: Ask an administrator to check runtime/metadata-panel.yml.
        technicalDetailTemplate: 'Invalid metadata panel runtime field: {field}'
      contributor_role_label_key_invalid:
        title: A metadata panel contributor role label key is invalid
        detail: LODEON could not read one configured contributor role label key.
        hint: Ask an administrator to check runtime/metadata-panel.yml.
        technicalDetailTemplate: 'Invalid metadata panel runtime field: {field}'
      contributor_role_schema_org_property_invalid:
        title: A metadata panel contributor role schema.org property is invalid
        detail: LODEON could not read one configured contributor role schema.org property.
        hint: Ask an administrator to check runtime/metadata-panel.yml.
        technicalDetailTemplate: 'Invalid metadata panel runtime field: {field}'
      default_contributor_role_invalid:
        title: The metadata panel default contributor role is invalid
        detail: LODEON could not find the configured default contributor role.
        hint: Ask an administrator to check runtime/metadata-panel.yml.
        technicalDetailTemplate: 'Invalid metadata panel runtime field: {field}'
      fields_invalid:
        title: The metadata panel fields configuration is invalid
        detail: LODEON could not read the configured metadata fields.
        hint: Ask an administrator to check runtime/metadata-panel.yml.
        technicalDetailTemplate: 'Invalid metadata panel runtime field: {field}'
      field_invalid:
        title: A metadata panel field configuration is invalid
        detail: LODEON could not read one configured metadata field.
        hint: Ask an administrator to check runtime/metadata-panel.yml.
        technicalDetailTemplate: 'Invalid metadata panel runtime field: {field}'
      field_enabled_invalid:
        title: A metadata panel field enabled flag is invalid
        detail: LODEON could not read whether one metadata field is enabled.
        hint: Ask an administrator to check runtime/metadata-panel.yml.
        technicalDetailTemplate: 'Invalid metadata panel runtime field: {field}'
    knowledge_graph:
      profile_search_invalid:
        title: A knowledge graph search configuration is invalid
        detail: LODEON could not read the search configuration of one knowledge graph profile.
        hint: Ask an administrator to check the profile search configuration.
        technicalDetailTemplate: 'Invalid field {field} in knowledge graph profile: {profileId}'
      profile_fulltext_invalid:
        title: A knowledge graph fulltext configuration is invalid
        detail: LODEON could not read the fulltext configuration of one knowledge graph profile.
        hint: Ask an administrator to check the profile fulltext configuration.
        technicalDetailTemplate: 'Invalid field {field} in knowledge graph profile: {profileId}'
      profile_fulltext_enabled_invalid:
        title: A knowledge graph fulltext enabled flag is invalid
        detail: LODEON could not read whether fulltext search is enabled for one knowledge graph profile.
        hint: Set search.fullText.enabled to true or false.
        technicalDetailTemplate: 'Invalid field {field} in knowledge graph profile: {profileId}'
      profile_fulltext_provider_invalid:
        title: A knowledge graph fulltext provider is invalid
        detail: LODEON could not use the configured fulltext provider of one knowledge graph profile.
        hint: Choose an implemented fulltext provider.
        technicalDetailTemplate: 'Invalid provider {provider} in field {field} for knowledge graph profile: {profileId}'
      profile_fulltext_tools_invalid:
        title: A knowledge graph fulltext tool list is invalid
        detail: LODEON could not read the configured fulltext-enabled tools of one knowledge graph profile.
        hint: Use only supported LODEON search tool names.
        technicalDetailTemplate: 'Invalid field {field} in knowledge graph profile {profileId}; supported tools: {tools}'
      profile_fulltext_limit_invalid:
        title: A knowledge graph fulltext limit is invalid
        detail: LODEON could not read the default fulltext result limit of one knowledge graph profile.
        hint: Set search.fullText.defaultLimit to a positive integer.
        technicalDetailTemplate: 'Invalid field {field} in knowledge graph profile: {profileId}'
      profile_fulltext_min_score_invalid:
        title: A knowledge graph fulltext minimum score is invalid
        detail: LODEON could not read the minimum fulltext score of one knowledge graph profile.
        hint: Use a number or null for search.fullText.minScore.
        technicalDetailTemplate: 'Invalid field {field} in knowledge graph profile: {profileId}'
      profile_fulltext_language_invalid:
        title: A knowledge graph fulltext language setting is invalid
        detail: LODEON could not read the fulltext language setting of one knowledge graph profile.
        hint: Use a non-empty language string or null.
        technicalDetailTemplate: 'Invalid field {field} in knowledge graph profile: {profileId}'
      profile_fulltext_guidance_invalid:
        title: A knowledge graph fulltext guidance configuration is invalid
        detail: LODEON could not read the model guidance configuration of one knowledge graph profile.
        hint: Ask an administrator to check search.fullText.queryGuidance.
        technicalDetailTemplate: 'Invalid field {field} in knowledge graph profile: {profileId}'
      profile_fulltext_next_step_invalid:
        title: A knowledge graph fulltext next-step setting is invalid
        detail: LODEON could not read the configured fulltext next-step guidance of one knowledge graph profile.
        hint: Choose a supported fulltext next-step value.
        technicalDetailTemplate: 'Invalid field {field} in knowledge graph profile {profileId}; supported values: {nextSteps}'
      profile_fulltext_inline_invalid:
        title: A knowledge graph fulltext inline-SPARQL setting is invalid
        detail: LODEON could not read whether inline provider fulltext syntax is allowed in later SPARQL.
        hint: Set search.fullText.queryGuidance.allowInlineFullTextInSparql to true or false.
        technicalDetailTemplate: 'Invalid field {field} in knowledge graph profile: {profileId}'
      profile_fulltext_providers_invalid:
        title: A knowledge graph fulltext provider registry is invalid
        detail: LODEON could not read the configured fulltext provider registry of one knowledge graph profile.
        hint: Configure provider entries under search.fullText.providers.
        technicalDetailTemplate: 'Invalid field {field} in knowledge graph profile: {profileId}'
      profile_fulltext_provider_config_invalid:
        title: A knowledge graph fulltext provider entry is invalid
        detail: LODEON could not read one fulltext provider configuration entry.
        hint: Configure only implemented fulltext providers.
        technicalDetailTemplate: 'Invalid provider entry {provider} in field {field} for knowledge graph profile: {profileId}'
      profile_entity_reidentification_invalid:
        title: A knowledge graph entity reidentification configuration is invalid
        detail: LODEON could not read the entity reidentification configuration of one knowledge graph profile.
        hint: Ask an administrator to check search.entityReidentification.
        technicalDetailTemplate: 'Invalid field {field} in knowledge graph profile: {profileId}'
      profile_entity_reidentification_enabled_invalid:
        title: A knowledge graph entity reidentification enabled flag is invalid
        detail: LODEON could not read whether entity reidentification is enabled for one knowledge graph profile.
        hint: Set search.entityReidentification.enabled to true or false.
        technicalDetailTemplate: 'Invalid field {field} in knowledge graph profile: {profileId}'
      profile_entity_reidentification_patterns_invalid:
        title: A knowledge graph entity reidentification pattern registry is invalid
        detail: LODEON could not read the configured entity reidentification patterns of one knowledge graph profile.
        hint: Configure pattern entries under search.entityReidentification.patterns.
        technicalDetailTemplate: 'Invalid field {field} in knowledge graph profile: {profileId}'
      profile_entity_reidentification_pattern_invalid:
        title: A knowledge graph entity reidentification pattern is invalid
        detail: LODEON could not read one entity reidentification pattern entry.
        hint: Use a non-empty pattern id and a mapping object.
        technicalDetailTemplate: 'Invalid pattern {patternId} in field {field} for knowledge graph profile: {profileId}'
      profile_entity_reidentification_pattern_type_invalid:
        title: A knowledge graph entity reidentification pattern type is invalid
        detail: LODEON could not read one entity reidentification pattern type.
        hint: Use a supported entity reidentification pattern type.
        technicalDetailTemplate: 'Invalid pattern {patternId} in field {field} for knowledge graph profile: {profileId}'
      profile_entity_reidentification_pattern_field_invalid:
        title: A knowledge graph entity reidentification pattern field is invalid
        detail: LODEON could not read one required field of an entity reidentification pattern.
        hint: Configure label, anchorVariable, nodeVariable, and sparqlPattern.
        technicalDetailTemplate: 'Invalid pattern {patternId} in field {field} for knowledge graph profile: {profileId}'
      profile_graph_explorer_invalid:
        title: A knowledge graph explorer configuration is invalid
        detail: LODEON could not read the graph explorer configuration of one knowledge graph profile.
        hint: Ask an administrator to check the graphExplorer profile configuration.
        technicalDetailTemplate: 'Invalid field {field} in knowledge graph profile: {profileId}'
      profile_graph_explorer_enabled_invalid:
        title: A knowledge graph explorer enabled flag is invalid
        detail: LODEON could not read whether graph exploration is enabled for one knowledge graph profile.
        hint: Set graphExplorer.enabled to true or false.
        technicalDetailTemplate: 'Invalid field {field} in knowledge graph profile: {profileId}'
      profile_graph_explorer_list_invalid:
        title: A knowledge graph explorer property list is invalid
        detail: LODEON could not read one configured graph explorer property list.
        hint: Use a list of non-empty IRI strings.
        technicalDetailTemplate: 'Invalid field {field} in knowledge graph profile: {profileId}'
      profile_graph_explorer_direction_invalid:
        title: A knowledge graph explorer direction is invalid
        detail: LODEON could not read the configured graph traversal direction.
        hint: Choose a supported graph explorer direction.
        technicalDetailTemplate: 'Invalid field {field} in knowledge graph profile {profileId}; supported values: {directions}'
      profile_graph_explorer_limit_invalid:
        title: A knowledge graph explorer limit is invalid
        detail: LODEON could not read one configured graph explorer limit.
        hint: Use positive integers for graph explorer limits.
        technicalDetailTemplate: 'Invalid field {field} in knowledge graph profile: {profileId}'
      profile_graph_explorer_boolean_invalid:
        title: A knowledge graph explorer option is invalid
        detail: LODEON could not read one configured graph explorer boolean option.
        hint: Set graph explorer options to true or false.
        technicalDetailTemplate: 'Invalid field {field} in knowledge graph profile: {profileId}'
      profile_graph_explorer_result_mapping_invalid:
        title: A knowledge graph explorer result mapping is invalid
        detail: LODEON could not read the SPARQL result mapping for graph explorer start resources.
        hint: Configure resultMapping.iri and resultMapping.label as lists of variable names.
        technicalDetailTemplate: 'Invalid field {field} in knowledge graph profile: {profileId}'
      profile_graph_explorer_color_scheme_invalid:
        title: A knowledge graph explorer color scheme is invalid
        detail: LODEON could not read one configured graph explorer color scheme.
        hint: Configure defaultColorScheme and colorSchemes with nodeColors iri, blank, literal and edgeColors default.
        technicalDetailTemplate: 'Invalid field {field} in knowledge graph profile: {profileId}'
      profile_graph_explorer_node_popup_invalid:
        title: A knowledge graph explorer node popup configuration is invalid
        detail: LODEON could not read the configured graph explorer node popup metadata.
        hint: Configure nodePopup with enabled, typeLabelProperties, and property definitions containing id, label, predicate, link, and maxValues.
        technicalDetailTemplate: 'Invalid field {field} in knowledge graph profile: {profileId}'
    auth:
      methods_invalid:
        title: The authentication methods are invalid
        detail: LODEON could not start because the resolved authentication method configuration is invalid.
        hint: Configure at least one valid login method when authentication is enabled.
        technicalDetailTemplate: 'Invalid authentication method field: {field}'
      token_credential_invalid:
        title: A token credential is invalid
        detail: LODEON could not start because a named token credential is incomplete or its secret is unavailable.
        hint: Check the credential id, tokenEnv reference, groups, and injected environment secret.
        technicalDetailTemplate: 'Invalid token credential field: {field}'
      bearer_credential_invalid:
        title: A Bearer credential is invalid
        detail: LODEON could not start because a named machine credential is incomplete or its secret is unavailable.
        hint: Check the credential id, tokenEnv reference, groups, and injected environment secret.
        technicalDetailTemplate: 'Invalid Bearer credential field: {field}'
      external_provider_invalid:
        title: An external login provider is invalid
        detail: LODEON could not start because an external login provider configuration is invalid.
        hint: Check the provider protocol, endpoints, client secret, scopes, claim mappings, and optional icon.
        technicalDetailTemplate: 'Invalid external login provider field: {field}'
      access_policy_invalid:
        title: An authentication access policy is invalid
        detail: LODEON could not start because a group-based access policy has the wrong structure.
        hint: Use a non-empty allowedGroups list only with enabled authentication.
        technicalDetailTemplate: 'Invalid authentication access policy field: {field}'
    renderer:
      invalid:
        title: The renderer configuration is invalid
        detail: LODEON could not load the active renderer engine configuration.
        hint: Ask an administrator to check config/runtime/renderers.yml and local renderer overrides.
        technicalDetailTemplate: 'Invalid renderer configuration field: {field}'
      active_engine_invalid:
        title: The active renderer engine is invalid
        detail: LODEON could not load the renderer configuration because renderer.activeEngine is invalid.
        hint: Set renderer.activeEngine to a configured renderer engine id.
        technicalDetailTemplate: 'Invalid renderer configuration field: {field}'
      engines_file_invalid:
        title: The renderer engines file is invalid
        detail: LODEON could not load the renderer configuration because renderer.enginesFile is invalid.
        hint: Set renderer.enginesFile to a safe runtime renderer configuration path.
        technicalDetailTemplate: 'Invalid renderer configuration field: {field}'
      engines_invalid:
        title: The renderer engines configuration is invalid
        detail: LODEON could not load the renderer configuration because the engines section is missing or invalid.
        hint: Check the configured runtime renderer file.
        technicalDetailTemplate: 'Invalid renderer engines field: {field}'
      active_engine_unknown:
        title: The active renderer engine is not configured
        detail: LODEON could not find the configured active renderer engine.
        hint: Add the active renderer engine to the runtime renderer configuration or select another engine.
        technicalDetailTemplate: 'Unknown renderer engine: {activeEngine}'
      engine_id_invalid:
        title: A renderer engine ID is invalid
        detail: LODEON could not load the renderer configuration because an engine id is invalid.
        hint: Use non-empty renderer engine ids.
      engine_invalid:
        title: A renderer engine is invalid
        detail: LODEON could not load the renderer configuration because an engine has the wrong structure.
        hint: Check the renderer engine configuration.
        technicalDetailTemplate: 'Invalid renderer engine: {engineId}'
      metadata_invalid:
        title: Renderer metadata configuration is invalid
        detail: LODEON could not load renderer metadata configuration.
        hint: Check renderer metadata mappings.
        technicalDetailTemplate: Invalid renderer metadata configuration for {engineId}
      metadata_jsonld_invalid:
        title: Renderer JSON-LD configuration is invalid
        detail: LODEON could not load renderer JSON-LD metadata configuration.
        hint: Check renderer metadata JSON-LD mappings.
        technicalDetailTemplate: Invalid renderer JSON-LD configuration for {engineId}
      metadata_jsonld_type_missing:
        title: Renderer JSON-LD type is missing
        detail: LODEON could not load renderer JSON-LD metadata configuration because the type is missing.
        hint: Configure the JSON-LD schema.org type.
        technicalDetailTemplate: Missing renderer JSON-LD type for {engineId}
      metadata_jsonld_properties_invalid:
        title: Renderer JSON-LD properties are invalid
        detail: LODEON could not load renderer JSON-LD metadata configuration because properties are invalid.
        hint: Configure JSON-LD properties as an object.
        technicalDetailTemplate: Invalid renderer JSON-LD properties for {engineId}
      mapping_group_invalid:
        title: A renderer mapping group is invalid
        detail: LODEON could not load renderer mappings because a mapping group has the wrong structure.
        hint: Check formatMappings, containerMappings, and specialNodeMappings.
        technicalDetailTemplate: Invalid renderer mapping group {group} for {engineId}
      mapping_id_invalid:
        title: A renderer mapping ID is invalid
        detail: LODEON could not load renderer mappings because a mapping id is invalid.
        hint: Use non-empty renderer mapping ids.
        technicalDetailTemplate: Invalid renderer mapping id in {engineId}.{group}
      mapping_invalid:
        title: A renderer mapping is invalid
        detail: LODEON could not load renderer mappings because a mapping has the wrong structure.
        hint: Check the affected renderer mapping.
        technicalDetailTemplate: Invalid renderer mapping {engineId}.{group}.{mappingId}
      mapping_strategy_missing:
        title: A renderer mapping strategy is missing
        detail: LODEON could not load renderer mappings because a mapping strategy is missing.
        hint: Configure a supported renderer mapping strategy.
        technicalDetailTemplate: Missing renderer mapping strategy for {engineId}.{group}.{mappingId}
      mapping_strategy_unsupported:
        title: A renderer mapping strategy is unsupported
        detail: LODEON could not load renderer mappings because a mapping strategy is not supported.
        hint: Use a supported renderer mapping strategy for the mapping group.
        technicalDetailTemplate: 'Unsupported renderer mapping strategy for {engineId}.{group}.{mappingId}: {strategy}'
      mapping_strategy_engine_unsupported:
        title: A renderer mapping strategy is not supported by this engine
        detail: LODEON could not load renderer mappings because a strategy is only supported by another renderer engine.
        hint: Use an engine-compatible mapping strategy.
        technicalDetailTemplate: 'Renderer mapping strategy not supported by {engineId}: {strategy}'
      template_directory_missing:
        title: A renderer template directory is missing
        detail: LODEON could not load renderer mappings because a template mapping has no renderer template directory.
        hint: Configure templateDirectory for the active renderer engine.
        technicalDetailTemplate: Missing renderer template directory for {engineId}.{group}.{mappingId}
      template_directory_invalid:
        title: A renderer template directory is invalid
        detail: LODEON could not load renderer mappings because a renderer template directory is invalid.
        hint: Use a relative templateDirectory inside the active configuration package.
        technicalDetailTemplate: 'Invalid renderer template directory for {engineId}.{field}: {path}'
      mapping_template_invalid:
        title: A renderer mapping template is invalid
        detail: LODEON could not load renderer mappings because a template mapping has no valid template path.
        hint: Configure a relative template path inside the active renderer template directory.
        technicalDetailTemplate: 'Invalid renderer mapping template for {engineId}.{group}.{mappingId}.{field}: {path}'
      mapping_template_missing:
        title: A renderer mapping template is missing
        detail: LODEON could not load renderer mappings because a configured template file was not found.
        hint: Add the template file under the active renderer template directory.
        technicalDetailTemplate: 'Missing renderer mapping template for {engineId}.{group}.{mappingId}: {template}'
      template_file_read_failed:
        title: A renderer template file could not be read
        detail: LODEON could not load renderer mappings because a renderer template file could not be read.
        hint: Check the template file permissions and encoding.
        technicalDetailTemplate: 'Renderer template read failed for {engineId}.{template}: {externalError}'
    editor:
      invalid:
        title: The editor configuration is invalid
        detail: LODEON could not load the editor configuration.
        hint: Ask an administrator to check the editor section in the configuration.
        technicalDetailTemplate: 'Invalid editor configuration field: {field}'
    localization:
      invalid:
        title: The localization configuration is invalid
        detail: LODEON could not load the localization configuration.
        hint: Ask an administrator to check the localization section in the configuration.
        technicalDetailTemplate: 'Invalid localization configuration field: {field}'
      locale_invalid:
        title: A configured localization locale is invalid
        detail: LODEON could not load the localization configuration because a locale is invalid.
        hint: Set localization.activeLocale and localization.fallbackLocale to non-empty locale identifiers.
        technicalDetailTemplate: 'Invalid localization locale field: {field}'
      messages_directory_invalid:
        title: The localization directory is invalid
        detail: LODEON could not load the localization configuration because the configured directory is invalid.
        hint: Set localization.messagesDirectory to a safe relative Runtime localization directory.
        technicalDetailTemplate: 'Invalid localization messages directory field: {field}'
      locale_directory_missing:
        title: The localization locale directory is missing
        detail: LODEON could not load localization resources because a locale directory is missing.
        hint: Create the configured locale directory below the localization runtime directory.
        technicalDetailTemplate: 'Missing localization locale directory for {locale}: {path}'
      defaults_missing:
        title: No default localization resources were found
        detail: LODEON could not load localization resources because the locale has no default namespace files.
        hint: Add versioned *.yml namespace files for the configured locale.
        technicalDetailTemplate: 'Missing default localization namespace files for {locale}: {path}'
      namespace_duplicate:
        title: A localization namespace is duplicated
        detail: LODEON could not load localization resources because a namespace is defined more than once.
        hint: Ensure that each localization namespace appears only once per locale.
        technicalDetailTemplate: 'Duplicate localization namespace {namespace}: {path}'
      namespace_file_invalid:
        title: A localization namespace file name is invalid
        detail: LODEON could not load a localization namespace file because its filename is invalid.
        hint: Use lowercase namespace files ending in .yml.
        technicalDetailTemplate: 'Invalid localization namespace filename: {path}'
      resource_invalid:
        title: A localization resource is invalid
        detail: LODEON could not load a localization resource because the file does not contain a valid object.
        hint: Check the localization YAML file.
        technicalDetailTemplate: 'Invalid localization resource: {path}'
      schema_version_invalid:
        title: A localization resource schema version is invalid
        detail: LODEON could not load a localization resource because its schema version is unsupported.
        hint: Set schemaVersion to 1.
