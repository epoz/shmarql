    model:
      not_configured:
        title: No assistant model is configured
        detail: LODEON could not find a configured model for this assistant turn.
        hint: Ask an administrator to check the selected model profile.
      credentials_rejected:
        title: The model provider rejected the configured credentials
        detail: LODEON could not use the selected model because its provider rejected the configured credentials.
        hint: Choose another model or ask an administrator to check the model credential configuration.
      unavailable:
        title: The selected model is unavailable
        detail: The configured provider could not find or use the selected model.
        hint: Choose another model, try again later, or ask an administrator to check the model profile.
      context_limit_exceeded:
        title: The model context limit was exceeded
        detail: The selected model rejected the request because the complete input was too large.
        hint: Shorten the conversation, exclude optional Story Content, or choose a model with a larger context limit.
      provider_unavailable:
        title: The model provider is temporarily unavailable
        detail: The selected model provider could not complete the request.
        hint: Try again later or choose another model.
      connection_failed:
        title: The model provider could not be reached
        detail: LODEON could not connect to the configured model endpoint.
        hint: Try again later or ask an administrator to check the endpoint and network connection.
      request_failed:
        title: The model request failed
        detail: LODEON could not complete the request to the selected model provider.
        hint: Try again, choose another model, or ask an administrator to inspect the model provider configuration.
        technicalDetailTemplate: 'The model request failed with the following error: {externalError}'
      timeout:
        title: The model took too long to answer
        detail: The selected model did not answer before the configured timeout was reached.
        hint: Try again, use a shorter request, reduce story context, or choose a faster model.
        technicalDetailTemplate: 'The model request failed with the following error: {externalError}'
      rate_limited:
        title: The model provider rate limit was reached
        detail: The selected model provider temporarily rejected the request because too many requests were sent.
        hint: Wait a moment before trying again or choose another model profile.
        technicalDetailTemplate: 'The model request failed with the following error: {externalError}'
      message_format_rejected:
        title: The model provider rejected the conversation format
        detail: The selected model provider rejected the request format used for this assistant turn.
        hint: Try again without Force Tool Use, or choose another model. If the problem persists, ask an administrator to inspect the trace.
        technicalDetailTemplate: 'The model request failed with the following error: {externalError}'
      tool_calling_unavailable:
        title: Tool calling is not available for this model
        detail: The selected model did not confirm reliable structured tool-calling support.
        hint: Choose a model with reliable tool calling or disable Force Tool Use for general questions.
        technicalDetailTemplate: 'The model request failed with the following error: {externalError}'
    tool:
      required_but_missing:
        title: No assistant tools are available
        detail: Tool use was required for this turn, but LODEON did not have any tools available.
        hint: Ask an administrator to check the assistant tool configuration.
      no_structured_call_returned:
        title: The model did not use a tool
        detail: Tool use was required for this turn, but the selected model answered without a structured tool call.
        hint: Disable Force Tool Use for general questions, try again, or choose a model with reliable tool-calling support.
      no_evidence_call_returned:
        title: The model did not gather evidence
        detail: Tool use was required for this turn, but the selected model did not call an evidence-gathering tool before trying to continue.
        hint: Try again, disable Force Tool Use for general questions, or choose a model with reliable tool-calling support.
      unavailable:
        title: An assistant tool is unavailable
        detail: The assistant tried to use a tool that is currently not available.
        hint: Ask an administrator to check the assistant tool runtime.
      invalid_arguments:
        title: The assistant sent invalid tool arguments
        detail: The assistant tried to call a tool with arguments that LODEON could not accept.
        hint: Try again or rephrase the request more explicitly.
        technicalDetailTemplate: The assistant sent invalid arguments for tool {toolName}.
      execution_failed:
        title: An assistant tool failed
        detail: LODEON could not complete one of the assistant tool calls.
        hint: Try again. If the problem persists, ask an administrator to inspect the trace.
      evidence_context_too_large:
        title: The complete assistant tool evidence is too large
        detail: LODEON did not send the tool evidence to the model because the complete evidence exceeds the configured context boundary.
        hint: Use a more focused query or a user-controlled result-set page.
        technicalDetailTemplate: 'Tool events: {toolEventCount}; evidence characters: {evidenceChars}; configured context characters: {maxInputCharacters}.'
      evidence_contract_unknown:
        title: The assistant tool evidence contract is missing
        detail: LODEON cannot use the successful tool result because the tool has no registered evidence contract.
        hint: Ask an administrator to update the assistant tool evidence registry.
        technicalDetailTemplate: Missing evidence contract for assistant tool {toolName}.
      evidence_result_invalid:
        title: The assistant tool result is invalid
        detail: LODEON cannot use the assistant tool result because it is not a structured object.
        hint: Ask an administrator to inspect the tool implementation and trace.
        technicalDetailTemplate: Invalid evidence result for assistant tool {toolName}.
      evidence_result_shape_invalid:
        title: The assistant tool result shape is invalid
        detail: LODEON cannot use the successful tool result because required evidence fields are missing or invalid.
        hint: Ask an administrator to align the tool implementation with its evidence contract.
        technicalDetailTemplate: 'Invalid evidence fields for assistant tool {toolName}: {fields}.'
      evidence_graph_result_unsupported:
        title: Graph-shaped SPARQL evidence is not supported
        detail: LODEON cannot use this SPARQL result because the assistant evidence pipeline currently supports tabular SELECT and boolean ASK results.
        hint: Use a SELECT query that returns the required graph statements as rows.
        technicalDetailTemplate: Unsupported {queryType} evidence result for assistant tool {toolName}.
