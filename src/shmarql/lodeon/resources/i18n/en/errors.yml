      detail: LODEON could not fetch the IIIF resource.
      hint: Check the URL and try again.
      technicalDetailTemplate: 'IIIF resource loading failed with the following error: {externalError}'
    info_json_invalid:
      title: The IIIF image service is invalid
      detail: The resource does not contain a valid IIIF Image API info.json response.
      hint: Use a IIIF Image API info.json URL or a Presentation API manifest URL.
    manifest_invalid:
      title: The IIIF manifest is invalid
      detail: The resource does not contain a valid IIIF Presentation API manifest.
      hint: Use a valid IIIF manifest URL or Image API info.json URL.
    no_image_service:
      title: No IIIF image service was found
      detail: The IIIF manifest does not contain a supported image service.
      hint: Use another IIIF manifest or an Image API info.json URL.
    no_canvas:
      title: No IIIF canvas was found
      detail: The IIIF manifest does not contain a canvas that LODEON can display.
      hint: Use another IIIF manifest or an Image API info.json URL.
