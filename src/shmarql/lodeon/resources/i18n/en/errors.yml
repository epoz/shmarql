      unavailable:
        title: An external assistant Tool service is unavailable
        detail: LODEON could not reach one configured external MCP service for this turn.
        hint: Try again later or ask an administrator to check the external Tool service.
        technicalDetailTemplate: 'External MCP server {serverId} is unavailable during {operation}.'
      timeout:
        title: An external assistant Tool took too long
        detail: LODEON stopped the external MCP request at its configured deadline.
        hint: Try again with a narrower request or ask an administrator to check the external Tool service.
        technicalDetailTemplate: 'External MCP server {serverId} timed out during {operation}.'
      network_policy_denied:
        title: An external assistant Tool endpoint is not permitted
        detail: LODEON refused the resolved MCP endpoint because it is outside the configured network policy.
        hint: Ask an administrator to check the external MCP server URL and private-network setting.
        technicalDetailTemplate: 'External MCP server {serverId} resolved to a forbidden target.'
      redirect_forbidden:
        title: An external assistant Tool redirect was refused
        detail: LODEON does not follow redirects from configured MCP endpoints.
        hint: Ask an administrator to configure the final MCP endpoint URL directly.
        technicalDetailTemplate: 'External MCP server {serverId} returned a redirect during {operation}.'
      protocol_invalid:
        title: An external assistant Tool returned an invalid MCP response
        detail: LODEON could not validate the external service response as supported MCP Streamable HTTP.
        hint: Ask an administrator to check the MCP service version and transport configuration.
        technicalDetailTemplate: 'Invalid external MCP response from {serverId} during {operation}: {reason}'
      tool_not_advertised:
        title: A configured external assistant Tool is unavailable
        detail: The external MCP server did not advertise one Tool that this LODEON profile allowlists.
        hint: Ask an administrator to align the Package Tool allowlist with the external service.
        technicalDetailTemplate: 'External MCP server {serverId} did not advertise Tool {toolName}.'
      tool_definition_invalid:
        title: An external assistant Tool definition is invalid
        detail: LODEON refused an advertised external Tool definition because it is invalid or exceeds configured limits.
        hint: Ask an administrator to inspect the external MCP Tool schema and description.
        technicalDetailTemplate: 'Invalid Tool definition from external MCP server {serverId}: {toolName}'
      response_too_large:
        title: An external assistant Tool response is too large
        detail: LODEON refused the complete external MCP response because it exceeds the configured boundary.
        hint: Use a narrower Tool request or ask an administrator to review the response limit.
        technicalDetailTemplate: 'External MCP server {serverId} returned {actualBytes} bytes; configured maximum is {maximumBytes} bytes.'
      call_failed:
        title: An external assistant Tool failed
        detail: The external MCP service could not complete the requested Tool call.
        hint: Try again or ask an administrator to inspect the Assistant trace and external service.
        technicalDetailTemplate: 'External MCP Tool {toolName} on server {serverId} failed.'
    sparql:
      not_read_only:
        title: The SPARQL query is not read-only
        detail: LODEON only allows read-only SPARQL queries.
        hint: Use SELECT, ASK, CONSTRUCT, or DESCRIBE. SERVICE clauses are allowed, but update operations are blocked.
      endpoint_failed:
        title: The knowledge graph endpoint did not answer
        detail: LODEON could not retrieve data from the selected knowledge graph endpoint.
        hint: Try again later or ask an administrator to check the knowledge graph profile and endpoint.
    followup:
      invalid_rule:
        title: An assistant follow-up rule is invalid
        detail: LODEON could not evaluate the configured follow-up rules for this assistant turn.
        hint: Ask an administrator to check the runtime and profile follow-up rules.
        technicalDetailTemplate: 'The follow-up rules failed with the following error: {externalError}'
      execution_failed:
        title: Assistant follow-up handling failed
        detail: LODEON could not complete the deterministic follow-up handling for this assistant turn.
        hint: Ask an administrator to inspect the trace and follow-up rule configuration.
    suggestions:
      failed:
        title: Suggested questions could not be generated
        detail: LODEON could not generate assistant follow-up suggestions for this turn.
        hint: You can continue writing or ask a new question manually.
    cancel:
      failed:
        title: Assistant turn could not be stopped
        detail: LODEON could not submit the stop request for the current assistant turn.
        hint: Wait for the current turn to finish, then try again if needed.
    probe:
      failed:
        title: Tool-calling probe failed
        detail: LODEON could not verify tool-calling support for the selected model.
        hint: Try again or choose another model profile.
      checking:
        title: Checking native tool calling
        detail: LODEON is checking whether the selected model supports native structured tool calls.
        hint: Wait for the probe result.
      structured_tool_call_returned:
        title: Native tool calling available
        detail: The selected model returned the structured probe tool call.
        hint: Tool-backed assistant workflows can use native tool calls with this profile.
      no_structured_tool_call_returned:
        title: Native tool calling unavailable
        detail: The selected model did not return a structured probe tool call.
        hint: Use content-fallback mode or choose another model profile for native tool calling.
