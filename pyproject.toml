[project]
name = "shmarql"
version = "0.73"
description = "A Linked Data publishing platform for semantic web professionals in a hurry."
readme = "README.md"
authors = [{ name = "Etienne Posthumus", email = "eposthumus@gmail.com" }]
license = "MIT"
requires-python = ">=3.11"
keywords = ["SPARQL", "RDF", "Linked Data", "FastAPI"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "rdflib>=7.1",
    "markdown>=3.6",
    "pymdown-extensions>=10.9",
    "pygments>=2.18",
    "nh3>=0.2.18",
]

[project.scripts]
shmarql = "shmarql.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shmarql"]

[tool.hatch.build.targets.sdist]
# editor/ is the source of src/shmarql/lodeon_editor/; leave out its npm install
exclude = ["editor/node_modules", "editor/coverage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/shmarql/lodeon/nodes"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["shmarql"]
known-local-folder = ["conftest", "fake_endpoint"]
